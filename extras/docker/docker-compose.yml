services:
  postgres_db:
    image: postgres:16
    container_name: ticketing_postgres
    restart: always
    environment:
      POSTGRES_USER: ticketing_user
      POSTGRES_PASSWORD: ticketing_password
      POSTGRES_DB: ticketing
    ports:
      - "5432:5432"
    volumes:
      - ticketing_postgres_data:/var/lib/postgresql/data
    networks:
      - ticketing_network

  pgadmin:
    image: dpage/pgadmin4
    container_name: ticketing_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: adminpassword
      PGADMIN_LISTEN_PORT: 80
    ports:
      - "8080:80"
    networks:
      - ticketing_network

networks:
  ticketing_network:
    driver: bridge

volumes:
  ticketing_postgres_data:
    driver: local

